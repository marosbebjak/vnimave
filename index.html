<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vnímavé prechádzky</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,200;9..40,300;9..40,400&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #fff;
      font-family: 'DM Sans', sans-serif;
      color: #0f2d6b;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 3rem 1.5rem;
      gap: 2.5rem;
    }

    h1 {
      font-weight: 200;
      font-size: clamp(2.6rem, 16vw, 7.5rem);
      letter-spacing: -0.03em;
      line-height: 1;
      text-align: center;
      opacity: 0;
      animation: appear 1s cubic-bezier(0.16, 1, 0.3, 1) forwards 0.2s;
    }

    .foto {
      width: 100%;
      max-width: 680px;
      aspect-ratio: 3 / 2;
      object-fit: cover;
      opacity: 0;
      animation: appear 1s cubic-bezier(0.16, 1, 0.3, 1) forwards 0.5s;
    }

    .info {
      text-align: center;
      opacity: 0;
      animation: appear 1s cubic-bezier(0.16, 1, 0.3, 1) forwards 0.8s;
      display: flex;
      flex-direction: column;
      gap: 0.8rem;
    }

    .veta {
      font-weight: 300;
      font-size: clamp(0.95rem, 3vw, 1.1rem);
      line-height: 1.6;
      max-width: 38ch;
    }

    .mail {
      font-weight: 200;
      font-size: clamp(0.85rem, 2.5vw, 0.95rem);
      letter-spacing: 0.02em;
      text-decoration: none;
      color: #0f2d6b;
      border-bottom: 1px solid #0f2d6b;
      padding-bottom: 1px;
      align-self: center;
    }

    .mail:hover {
      opacity: 0.6;
    }

    @keyframes appear {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <h1>Vnímavé<br>prechádzky</h1>
  <img class="foto" src="foto.jpg" alt="Vnímavé prechádzky" />
  <div class="info">
    <p class="veta">Ukážeme vám Trenčín inými očami. Chcete sa pridať?</p>
    <a class="mail" href="mailto:bebjakova.jana@gmail.com">bebjakova.jana@gmail.com</a>
  </div>
</body>
</html>
