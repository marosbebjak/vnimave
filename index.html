<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vnímavé prechádzky</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,200;9..40,300&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
    }

    body {
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem;
    }

    h1 {
      font-family: 'DM Sans', sans-serif;
      font-weight: 200;
      font-size: clamp(2.6rem, 11vw, 7.5rem);
      color: #0f2d6b;
      letter-spacing: -0.03em;
      line-height: 1;
      text-align: center;
      opacity: 0;
      animation: appear 1s cubic-bezier(0.16, 1, 0.3, 1) forwards 0.2s;
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: translateY(16px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>
<body>
  <h1>Vnímavé<br>prechádzky</h1>
</body>
</html>
