<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vnímavé prechádzky</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,200;9..40,300;9..40,400&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #fff;
      font-family: 'DM Sans', sans-serif;
      color: #0f2d6b;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 3rem 1.5rem;
      gap: 2.5rem;
    }

    h1 {
      font-weight: 200;
      font-size: clamp(2.6rem, 16vw, 7.5rem);
      letter-spacing: -0.03em;
      line-height: 1;
      text-align: center;
      opacity: 0;
      animation: appear 1s cubic-bezier(0.16, 1, 0.3, 1) forwards 0.2s;
    }

    .foto {
      width: 100%;
      max-width: 680px;
      aspect-ratio: 3 / 2;
      object-fit: cover;
      opacity: 0;
      animation: appear 1s cubic-bezier(0.16, 1, 0.3, 1) forwards 0.5s;
    }

    .info {
      text-align: center;
      opacity: 0;
      animation: appear 1s cubic-bezier(0.16, 1, 0.3, 1) forwards 0.8s;
      display: flex;
      flex-direction: column;
      gap: 0.8rem;
    }

    .veta {
      font-weight: 300;
      font-size: clamp(0.95rem, 3vw, 1.1rem);
      line-height: 1.6;
      max-width: 38ch;
    }

    .mail {
      font-weight: 200;
      font-size: clamp(0.85rem, 2.5vw, 0.95rem);
      letter-spacing: 0.02em;
      text-decoration: none;
      color: #0f2d6b;
      border-bottom: 1px solid #0f2d6b;
      padding-bottom: 1px;
      align-self: center;
    }

    .mail:hover { opacity: 0.6; }

    /* Termíny */
    .terminy {
      width: 100%;
      max-width: 680px;
      display: flex;
      flex-direction: column;
      gap: 0;
      opacity: 0;
      animation: appear 1s cubic-bezier(0.16, 1, 0.3, 1) forwards 1s;
    }

    .terminy h2 {
      font-weight: 200;
      font-size: clamp(1.1rem, 4vw, 1.4rem);
      letter-spacing: -0.01em;
      margin-bottom: 1rem;
    }

    .termin {
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: auto auto;
      gap: 0.2rem 1rem;
      padding: 1rem 0;
      border-top: 1px solid #e0e6f0;
    }

    .termin:last-child {
      border-bottom: 1px solid #e0e6f0;
    }

    .termin-nazov {
      font-weight: 300;
      font-size: clamp(0.95rem, 3vw, 1.05rem);
      grid-column: 1;
      grid-row: 1;
    }

    .termin-datum {
      font-weight: 200;
      font-size: clamp(0.8rem, 2.5vw, 0.9rem);
      grid-column: 1;
      grid-row: 2;
      opacity: 0.7;
    }

    .termin-miesto {
      font-weight: 200;
      font-size: clamp(0.8rem, 2.5vw, 0.9rem);
      grid-column: 2;
      grid-row: 1 / 3;
      text-align: right;
      align-self: center;
      opacity: 0.7;
      line-height: 1.4;
    }

    .nacitavam {
      font-weight: 200;
      font-size: 0.9rem;
      opacity: 0.5;
    }

    @keyframes appear {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <h1>Vnímavé<br>prechádzky</h1>
  <img class="foto" src="foto.jpg" alt="Vnímavé prechádzky" />

  <div class="terminy">
    <h2>Najbližšie prechádzky</h2>
    <div id="zoznam"><p class="nacitavam">Načítavam termíny...</p></div>
  </div>

  <div class="info">
    <p class="veta">Ukážeme vám Trenčín inými očami. Chcete sa pridať?</p>
    <a class="mail" href="mailto:bebjakova.jana@gmail.com">bebjakova.jana@gmail.com</a>
  </div>

  <script>
    const SHEET_ID = '1aN3vDM2wXE2JcnCTUgYs1JwXSEE29CM7W-ZmALNQsE0';
    const URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json`;

    fetch(URL)
      .then(r => r.text())
      .then(text => {
        const json = JSON.parse(text.substring(47, text.length - 2));
        const rows = json.table.rows;
        const zoznam = document.getElementById('zoznam');

        if (!rows || rows.length === 0) {
          zoznam.innerHTML = '<p class="nacitavam">Žiadne termíny</p>';
          return;
        }

        zoznam.innerHTML = rows.map(row => {
          const date = row.c[0]?.v || '';
          const time = row.c[1]?.v || '';
          const name = row.c[2]?.v || '';
          const start = row.c[3]?.v || '';
          return `
            <div class="termin">
              <div class="termin-nazov">${name}</div>
              <div class="termin-datum">${date}${time ? ', ' + time : ''}</div>
              <div class="termin-miesto">${start}</div>
            </div>`;
        }).join('');
      })
      .catch(() => {
        document.getElementById('zoznam').innerHTML = '<p class="nacitavam">Termíny sa nepodarilo načítať.</p>';
      });
  </script>
</body>
</html>
