<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vnímavé prechádzky</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,200;9..40,300&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --blue: #0f2d6b;
      --blue-faint: #e0e6f0;
    }

    body {
      background: #fff;
      font-family: 'DM Sans', sans-serif;
      color: var(--blue);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 3rem 1.5rem;
      gap: 3rem;
    }

    /* Štýl 1 – hlavný nadpis */
    h1 {
      font-weight: 200;
      font-size: clamp(2.6rem, 16vw, 7.5rem);
      letter-spacing: -0.03em;
      line-height: 1;
      text-align: center;
      opacity: 0;
      animation: appear 1s cubic-bezier(0.16, 1, 0.3, 1) forwards 0.2s;
    }

    .foto {
      width: 100%;
      max-width: 680px;
      aspect-ratio: 3 / 2;
      object-fit: cover;
      opacity: 0;
      animation: appear 1s cubic-bezier(0.16, 1, 0.3, 1) forwards 0.5s;
    }

    .terminy {
      width: 100%;
      max-width: 680px;
      opacity: 0;
      animation: appear 1s cubic-bezier(0.16, 1, 0.3, 1) forwards 0.8s;
    }

    /* Štýl 2 – sekcia nadpis */
    .terminy h2 {
      font-weight: 200;
      font-size: clamp(1rem, 3.5vw, 1.15rem);
      margin-bottom: 1.2rem;
      opacity: 0.5;
    }

    .termin {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
      padding: 1.2rem 0;
      border-top: 1px solid var(--blue-faint);
    }

    .termin:last-child { border-bottom: 1px solid var(--blue-faint); }

    /* Štýl 2 – normálny text */
    .text-normal {
      font-weight: 300;
      font-size: clamp(1rem, 3.5vw, 1.15rem);
    }

    /* Štýl 3 – jemnejší text */
    .text-soft {
      font-weight: 200;
      font-size: clamp(1rem, 3.5vw, 1.15rem);
      opacity: 0.5;
    }

    .btn {
      display: inline-block;
      margin-top: 0.4rem;
      font-family: 'DM Sans', sans-serif;
      font-weight: 300;
      font-size: clamp(1rem, 3.5vw, 1.15rem);
      color: var(--blue);
      border: 1px solid var(--blue);
      padding: 0.4rem 1rem;
      text-decoration: none;
      align-self: flex-start;
      transition: background 0.2s, color 0.2s;
    }

    .btn:hover { background: var(--blue); color: #fff; }

    .info {
      text-align: center;
      opacity: 0;
      animation: appear 1s cubic-bezier(0.16, 1, 0.3, 1) forwards 1s;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
      align-items: center;
    }

    .mail {
      text-decoration: none;
      color: var(--blue);
      border-bottom: 1px solid var(--blue);
      padding-bottom: 1px;
    }

    .mail:hover { opacity: 0.6; }

    @keyframes appear {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <h1>Vnímavé<br>prechádzky</h1>
  <img class="foto" src="foto.jpg" alt="Vnímavé prechádzky" />

  <div class="terminy">
    <h2>Najbližšie prechádzky</h2>
    <div id="zoznam"><p class="text-soft">Načítavam termíny...</p></div>
  </div>

  <div class="info">
    <p class="text-normal">Ukážeme vám Trenčín inými očami. Chcete sa pridať?</p>
    <a class="text-normal mail" href="mailto:bebjakova.jana@gmail.com">bebjakova.jana@gmail.com</a>
  </div>

  <script>
    const SHEET_ID = '1aN3vDM2wXE2JcnCTUgYs1JwXSEE29CM7W-ZmALNQsE0';
    const URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json`;

    function formatDate(val) {
      if (!val) return '';
      const match = String(val).match(/Date\((\d+),(\d+),(\d+)/);
      if (match) {
        const d = new Date(+match[1], +match[2], +match[3]);
        return d.toLocaleDateString('sk-SK', { day: 'numeric', month: 'long', year: 'numeric' });
      }
      return val;
    }

    function formatTime(val) {
      if (!val) return '';
      const match = String(val).match(/Date\(\d+,\d+,\d+,(\d+),(\d+)/);
      if (match) {
        const h = String(+match[1]).padStart(2, '0');
        const m = String(+match[2]).padStart(2, '0');
        return `${h}:${m}`;
      }
      return val;
    }

    fetch(URL)
      .then(r => r.text())
      .then(text => {
        const json = JSON.parse(text.substring(47, text.length - 2));
        const rows = json.table.rows;
        const zoznam = document.getElementById('zoznam');

        if (!rows || rows.length === 0) {
          zoznam.innerHTML = '<p class="text-soft">Žiadne termíny</p>';
          return;
        }

        zoznam.innerHTML = rows.map(row => {
          const date = formatDate(row.c[0]?.v);
          const time = formatTime(row.c[1]?.v);
          const name = row.c[2]?.v || '';
          const start = row.c[3]?.v || '';
          const form = row.c[4]?.v || '';
          return `
            <div class="termin">
              <div class="text-normal">${name}</div>
              <div class="text-soft">${date}${time ? ', ' + time : ''}${start ? ' · ' + start : ''}</div>
              ${form ? `<a class="btn" href="${form}" target="_blank">Registrovať</a>` : ''}
            </div>`;
        }).join('');
      })
      .catch(() => {
        document.getElementById('zoznam').innerHTML = '<p class="text-soft">Termíny sa nepodarilo načítať.</p>';
      });
  </script>
</body>
</html>
